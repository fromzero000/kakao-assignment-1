<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Todo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-container">
        <header>
            <h1>TODO List</h1>
            <div id="week-range-label" class="week-range-label"></div>
        </header>

        <!-- 주간 뷰 날짜 네비게이션 -->
        <section class="date-navigation">
            <button id="prev-week-btn" class="nav-btn">&lt;</button>
            <div class="week-display" id="week-display">
                <!-- 요일과 날짜가 동적으로 렌더링됩니다 -->
            </div>
            <button id="next-week-btn" class="nav-btn">&gt;</button>
        </section>
        
        <section class="input-section">
            <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요..." />
            <button id="add-btn">추가</button>
        </section>


        <!-- 상태별 필터 탭 -->
        <section class="filter-section">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </section>

        <section class="list-section">
            <ul id="todo-list">
                <!-- Todo 항목들이 여기에 동적으로 추가됩니다 -->
            </ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
